name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot Engine version to build (e.g. 4.7.1)'
        required: false
        default: '4.7.1'
  workflow_call:
    inputs:
      godot_version:
        description: 'Godot Engine version to build'
        required: true
        type: string

# needed for GHCR login with GITHUB_TOKEN
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine if build is needed
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GODOT_VERSION: ${{ inputs.godot_version || '4.7.1' }}
        run: |
          set -euo pipefail

          # Always build for explicit manual or external (cron) triggers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "Explicit trigger (${{ github.event_name }}) — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For push: rebuild unconditionally if the Dockerfile changed
          if git diff --name-only HEAD~1 HEAD | grep -q "^Dockerfile$"; then
            echo "Dockerfile changed — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check whether the image already exists in GHCR for this version
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "ghcr.io/sharkyrawr/godot-docker:$GODOT_VERSION" > /dev/null 2>&1; then
            echo "ghcr.io/sharkyrawr/godot-docker:$GODOT_VERSION already exists — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No image found for $GODOT_VERSION — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [check]
    runs-on: ubuntu-latest
    # Only build & push on main branch pushes (not PRs), manual triggers, or when called as a reusable workflow
    if: (needs.check.outputs.should_build == 'true') && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')

    strategy:
      matrix:
        edition: ['', '_mono']
        platform: ['linux/amd64', 'linux/arm64', 'linux/386', 'linux/arm/v7']
        include:
          - edition: ''
            suffix: ''
            edition_name: 'standard'
          - edition: '_mono'
            suffix: '-mono'
            edition_name: 'mono'
          # Platform-specific metadata
          - platform: 'linux/amd64'
            platform_tag: 'amd64'
          - platform: 'linux/arm64'
            platform_tag: 'arm64'
          - platform: 'linux/386'
            platform_tag: '386'
          - platform: 'linux/arm/v7'
            platform_tag: 'armv7'

    env:
      GHCR_IMAGE: ghcr.io/sharkyrawr/godot-docker
      GODOT_VERSION: ${{ inputs.godot_version || '4.7.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.edition_name }}-${{ matrix.platform_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edition_name }}-${{ matrix.platform_tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            EDITION=${{ matrix.edition }}
            VERSION=${{ env.GODOT_VERSION }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.edition_name }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.edition_name }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.edition_name }}-${{ matrix.platform_tag }}
          path: /tmp/digests/${{ matrix.edition_name }}/*
          if-no-files-found: error
          retention-days: 1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  merge:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: (needs.check.outputs.should_build == 'true') && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')

    strategy:
      matrix:
        edition: ['', '_mono']
        include:
          - edition: ''
            suffix: ''
            edition_name: 'standard'
          - edition: '_mono'
            suffix: '-mono'
            edition_name: 'mono'

    env:
      GHCR_IMAGE: ghcr.io/sharkyrawr/godot-docker
      GODOT_VERSION: ${{ inputs.godot_version || '4.7.1' }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/${{ matrix.edition_name }}
          pattern: digests-${{ matrix.edition_name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest${{ matrix.suffix }}
            type=raw,value=${{ env.GODOT_VERSION }}${{ matrix.suffix }}
            type=raw,value=${{ env.GODOT_VERSION }}-${{ matrix.edition_name }}
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=sha,suffix=${{ matrix.suffix }}
          flavor: |
            latest=false

      - name: Create manifest list and push to GHCR
        working-directory: /tmp/digests/${{ matrix.edition_name }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image on GHCR
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:latest${{ matrix.suffix }}
